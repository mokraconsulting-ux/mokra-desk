function drawQR(canvas, text) {

  if (typeof qrcode !== 'function') { ctx.fillStyle = '#0a1462'; ctx.font = '800 ' + Math.round(size / 11) + 'px Montserrat'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, size / 2, size / 2); return; }
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(), cell = Math.floor(size / n), off = Math.floor((size - cell * n) / 2);

}

function closeDrawer() { const d = $('#drawer'); d.hidden = true; d.innerHTML = ''; }
function invite(g) {
  return `Hi ${String(g.name).split(/\s+/)[0]}, you're confirmed for ${EVENT.name}!\n\n${EVENT.date}, ${EVENT.time}\n${EVENT.place}\n\nGet your entry QR code here: ${S.admin.appUrl}\nTap Continue with Google (account ${g.googleEmail || g.email}) or type the email you registered with: ${g.email}.\n\nPlease bring your laptop or tablet: the lab is practical and highly interactive.\n\nSee you there,\nMOKRA Consulting`;
}

/* ---------- add / import ---------- */
function renderAdd() {
  $('#panel').innerHTML = `
  <div class="add-grid">
    <div class="card"><h2>Add one guest</h2><p>For late confirmations or approved walk-ins. They get a pass ID right away.</p><button class="btn primary block" style="margin-top:14px" data-act="new">New guest</button></div>
    <div class="card"><h2>Import from the form sheet</h2>
      <p>Copy the selected rows from your Google Form responses, including the header row, and paste them here. Name and email columns are matched automatically. Emails already on the list are skipped.</p>
      <label for="imp">Rows to import</label>
      <textarea id="imp" placeholder="Timestamp&#9;Email address&#9;Full name&#9;University …"></textarea>
      <p class="preview" id="ip"></p>
      <button class="btn primary block" data-act="import" id="ib" disabled>Import guests</button></div>
  </div>`;
  $('#imp').addEventListener('input', () => { const rows = parseRows($('#imp').value), known = new Set(S.list.map(g => g.email)), fresh = rows.filter(r => !known.has(r.email)).length;
    $('#ip').textContent = rows.length ? `${rows.length} found · ${fresh} new · ${rows.length - fresh} already on the list` : ($('#imp').value.trim() ? 'No rows with a name and an email yet. Include the header row.' : '');
    $('#ib').disabled = !fresh; });
}
function splitCSV(line) { const out = []; let cur = '', q = false; for (let i = 0; i < line.length; i++) { const ch = line[i];
  if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
  else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function parseRows(txt) {
  const lines = String(txt).split(/\r?\n/).filter(l => l.trim()); if (!lines.length) return [];
  const sep = lines[0].includes('\t') ? '\t' : ',', split = l => sep === '\t' ? l.split('\t') : splitCSV(l);
  let cols = ['name', 'email', 'phone', 'university', 'faculty', 'year'], start = 0;
  const head = split(lines[0]).map(s => s.trim().toLowerCase());
  if (head.some(h => /mail|อีเมล/.test(h)) && !head.some(h => h.includes('@'))) {
    start = 1;
    cols = head.map(h => /google|gmail/.test(h) ? 'googleEmail' : /mail|อีเมล/.test(h) ? 'email' : /phone|tel|mobile|โทร/.test(h) ? 'phone' : /univ|institution|school|มหาวิทยาลัย/.test(h) ? 'university' : /facult|major|program|คณะ|สาขา/.test(h) ? 'faculty' : /year|ชั้นปี/.test(h) ? 'year' : /^type$|role/.test(h) ? 'type' : /name|ชื่อ/.test(h) ? 'name' : '');
    const seen = new Set(); cols = cols.map(c => { if (!c || seen.has(c)) return ''; seen.add(c); return c; });
    if (!cols.includes('email') && cols.includes('googleEmail')) cols = cols.map(c => c === 'googleEmail' ? 'email' : c);
  }
  const out = [], dup = new Set();
  lines.slice(start).forEach(l => { const cells = split(l), r = {}; cols.forEach((c, i) => { if (c) r[c] = String(cells[i] || '').trim(); });
    r.email = String(r.email || '').toLowerCase();
    if (r.name && /.+@.+\..+/.test(r.email) && !dup.has(r.email)) { dup.add(r.email); if (!TYPES.includes(r.type)) r.type = 'Participant'; out.push(r); } });
  return out;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab],[data-filter],[data-quick],[data-undo],[data-del],[data-open]');
  if (!t) { if (e.target.id === 'drawer') closeDrawer(); return; }
  if (t.dataset.quick) { e.stopPropagation(); unlockAudio(); const id = t.dataset.quick, r = await doCheckin(id); if (r && !$('#drawer').hidden) openDrawer(id); return; }
  if (t.dataset.undo) { try { const g = await call('undo', A({ id: t.dataset.undo })); const i = S.list.findIndex(x => x.id === g.id); if (i > -1) S.list[i] = g; updateStats(); renderRows(); openDrawer(g.id); toast('Check-in undone'); } catch (err) { toast(err.message); } return; }
  if (t.dataset.del) { if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Tap again to remove'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Remove guest'; } }, 3500); return; }
    try { await call('remove', A({ id: t.dataset.del })); S.list = S.list.filter(x => x.id !== t.dataset.del); closeDrawer(); updateStats(); renderRows(); toast('Guest removed'); } catch (err) { toast(err.message); } return; }
  if (t.dataset.open) { openDrawer(t.dataset.open); return; }
  if (t.dataset.tab) { showTab(t.dataset.tab); return; }
  if (t.dataset.filter) { S.filter = t.dataset.filter; renderRows(); return; }
  switch (t.dataset.act) {
    case 'out': stopCam(); sess.del('bs26-desk'); S.admin = null; shownArrived = null; lastMilestone = null; return renderLogin();
    case 'copylink': return copyText(S.admin.appUrl);
    case 'startcam': return startCam();
    case 'stopcam': return stopCam();
    case 'snap': unlockAudio(); $('#snap').value = ''; return $('#snap').click();
    case 'csv': return copyText(csv());
    case 'new': return openDrawer(null);
    case 'close': return closeDrawer();
    case 'showqr': { const id = $('#drawer').dataset.id; $('#qrSlot').innerHTML = '<div class="mini-qr"><canvas></canvas></div>'; return drawQR($('#qrSlot canvas'), id); }
    case 'invite': { const g = S.list.find(x => x.id === $('#drawer').dataset.id); return g && copyText(invite(g)); }
    case 'import': { const rows = parseRows($('#imp').value); t.disabled = true; t.textContent = 'Importing…';
      try { const r = await call('import', A({ rows })); S.list = await call('list', A({})); updateStats(); toast(`${r.added} added · ${r.skipped} skipped`); $('#imp').value = ''; $('#ip').textContent = ''; }
      catch (err) { toast(err.message); t.disabled = false; }
      t.textContent = 'Import guests'; return; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#drawer').hidden) closeDrawer(); $('#result').hidden = true; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-open]')) { e.preventDefault(); openDrawer(e.target.dataset.open); }
});
$('#result').addEventListener('click', () => { $('#result').hidden = true; });
$('#snap').addEventListener('change', e => snapFile(e.target.files && e.target.files[0]));
document.addEventListener('visibilitychange', refresh);

(async () => {
  const saved = sess.get('bs26-desk');
  if (saved && saved.pass) { try { await enter(saved.pass, saved.by); return; } catch (e) {} }
  renderLogin();
})();
})();
</script>
</body>
